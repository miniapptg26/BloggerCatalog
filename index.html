<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Каталог блогеров — YouTube, TikTok, Telegram, Instagram и Twitch: ниши, подписчики, верификация и прямые ссылки на профили.">
  <title>Каталог блогеров</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div class="header-titles">
        <h1>Каталог блогеров</h1>
        <p class="subtitle">Авторы и каналы — по платформам и нишам</p>
      </div>
      <span class="header-actions">
        <button id="adminOpenBtn" class="admin-open-btn hidden" type="button" aria-label="Админ-панель: добавить блогера" title="Админ-панель">➕</button>
        <span id="countLabel" class="count-label">0 блогеров</span>
      </span>
    </div>
  </header>

  <main class="main">
    <section class="search-section" aria-label="Поиск и фильтры">
      <div class="search-row">
        <input
          id="searchInput"
          class="search-input"
          type="search"
          inputmode="search"
          placeholder="Поиск по имени, нише или платформе…"
          aria-label="Поиск по каталогу"
          autocomplete="off"
        >
        <select id="sortSelect" class="sort-select" aria-label="Сортировка">
          <option value="subs">По подписчикам</option>
          <option value="name">По имени А-Я</option>
          <option value="id">Сначала новые</option>
        </select>
      </div>
      <div id="chips" class="chips" role="group" aria-label="Платформы"></div>
    </section>

    <section aria-label="Каталог блогеров">
      <div id="catalog" class="catalog"></div>
      <div id="emptyState" class="empty-state" hidden>
        <div class="empty-emoji" aria-hidden="true">📭</div>
        <p>Ничего не найдено</p>
        <p class="empty-sub">Попробуйте изменить запрос или сбросить фильтры</p>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Админ-панель: видна только администратору (@g179p) -->
  <div id="adminModal" class="modal" aria-hidden="true">
    <div class="modal-overlay" data-admin-close=""></div>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-label="Админ-панель">
      <div class="modal-head">
        <h2>Админ-панель</h2>
        <button id="adminCloseBtn" class="modal-close" type="button" aria-label="Закрыть">✕</button>
      </div>
      <div class="modal-body">
        <section class="admin-section">
          <h3>🔗 Подключение к GitHub</h3>
          <label class="field">
            <span>Token (fine-grained)</span>
            <input id="ghToken" type="password" placeholder="Fine-grained token…" autocomplete="off">
          </label>
          <div class="field-row">
            <label class="field">
              <span>Владелец (owner)</span>
              <input id="ghOwner" type="text" placeholder="username" autocomplete="off">
            </label>
            <label class="field">
              <span>Репозиторий</span>
              <input id="ghRepo" type="text" placeholder="blogger-catalog" autocomplete="off">
            </label>
          </div>
          <button id="checkGitHubBtn" class="check-btn" type="button">Проверить связь</button>
          <div id="githubStatus" class="github-status" role="status"></div>
        </section>

        <section class="admin-section">
          <h3>📋 Записи в каталоге</h3>
          <button id="loadItemsBtn" class="load-btn" type="button">🔄 Загрузить список</button>
          <div id="itemsStatus" class="github-status" role="status"></div>
          <div id="itemsList" class="items-list" aria-live="polite"></div>
        </section>

        <section class="admin-section">
          <h3>👤 Новый блогер</h3>
          <label class="field">
            <span>Имя на карточке *</span>
            <input id="adminDisplayName" type="text" placeholder="Пётр Художник">
          </label>
          <label class="field">
            <span>Ник (с @) *</span>
            <input id="adminName" type="text" placeholder="@petr_paint" autocomplete="off">
          </label>
          <label class="field">
            <span>Ниша</span>
            <input id="adminNiche" type="text" list="nicheList" placeholder="Искусство и творчество">
            <datalist id="nicheList"></datalist>
          </label>
          <div class="field-row">
            <label class="field">
              <span>Платформа *</span>
              <select id="adminPlatform">
                <option value="youtube">YouTube</option>
                <option value="tiktok">TikTok</option>
                <option value="telegram">Telegram</option>
                <option value="instagram">Instagram</option>
                <option value="twitch">Twitch</option>
              </select>
            </label>
            <label class="field">
              <span>Подписчики *</span>
              <input id="adminSubscribers" type="number" min="0" step="1" inputmode="numeric" placeholder="450000">
            </label>
          </div>
          <label class="check-field">
            <input id="adminVerified" type="checkbox"> Верифицированный профиль
          </label>
          <label class="field">
            <span>Описание (опц.)</span>
            <textarea id="adminDescription" rows="2" placeholder="Короткое описание"></textarea>
          </label>
          <div class="field-row">
            <label class="field">
              <span>Ссылка на профиль</span>
              <input id="adminUrl" type="url" placeholder="https://youtube.com/@petr_paint" autocomplete="off">
            </label>
            <label class="field">
              <span>Эмодзи (опц.)</span>
              <input id="adminEmoji" type="text" maxlength="8" placeholder="🎨">
            </label>
          </div>
        </section>

        <button id="saveBtn" class="save-btn" type="button">💾 Сохранить в каталог</button>
      </div>
    </div>
  </div>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="app.js"></script>
</body>
</html>
